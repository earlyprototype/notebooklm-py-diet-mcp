[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notebooklm-py-diet-mcp"
version = "1.0.0"
description = "MCP server exposing Google NotebookLM as tools for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Thom Conaty", email = "thomconatydesign@gmail.com" }]
keywords = ["mcp", "notebooklm", "ai", "cursor", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "notebooklm-py[browser]>=0.8.6",
    # MCP SDK 2.0 removed mcp.server.fastmcp (replaced by mcp.server.mcpserver),
    # which this server is built on. Stay on the 1.x line until it is ported.
    "mcp[cli]>=1.0.0,<2.0.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
notebooklm-diet-mcp = "notebooklm_mcp_server:mcp.run"

[project.urls]
Repository = "https://github.com/earlyprototype/notebooklm-py-diet-mcp"

[tool.hatch.build.targets.wheel]
# Single-module project: the module name doesn't match the project name,
# so hatchling needs to be told explicitly what ships in the wheel.
only-include = ["notebooklm_mcp_server.py"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["notebooklm_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
